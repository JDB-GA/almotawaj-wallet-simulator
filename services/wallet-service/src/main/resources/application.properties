spring.application.name=wallet-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
spring.data.web.pageable.max-page-size=100
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${WALLET_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=${JWT_EXPIRATION_MS}
otp-secret=${OTP_SECRET}
cors-allowed-origins=${CORS_ALLOWED_ORIGINS}
storage-root=${STORAGE_ROOT}
resend-api-key=${RESEND_API_KEY}
mail-from=${MAIL_FROM}
mail-logo-url=${MAIL_LOGO_URL}
app-url=${APP_URL}
seed-token=${SEED_TOKEN:}
seed-password=${SEED_PASSWORD:}
identity-url=${IDENTITY_URL}
internal-api-token=${INTERNAL_API_TOKEN}
