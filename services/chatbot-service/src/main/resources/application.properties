spring.application.name=chatbot-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${PORT:8085}
server.error.include-stacktrace=never
jwt-secret=${JWT_SECRET}

gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.file-search-store=${GEMINI_FILE_SEARCH_STORE:}
gemini.timeout=${GEMINI_TIMEOUT:30s}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
