spring.application.name=wallet-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${PORT:8084}

spring.data.web.pageable.max-page-size=100
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/almotawaj}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt-secret=${JWT_SECRET}
otp-secret=${OTP_SECRET}
app-url=${APP_URL}
seed-token=${SEED_TOKEN:}
identity-url=${IDENTITY_URL}
internal-api-token=${INTERNAL_API_TOKEN}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=wallet-service
spring.kafka.consumer.auto-offset-reset=earliest
