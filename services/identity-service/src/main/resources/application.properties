spring.application.name=identity-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${PORT:8081}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
spring.data.web.pageable.max-page-size=100
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/almotawaj}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=${JWT_EXPIRATION_MS}
otp-secret=${OTP_SECRET}
cors-allowed-origins=${CORS_ALLOWED_ORIGINS}
storage-root=${STORAGE_ROOT}
internal-api-token=${INTERNAL_API_TOKEN}
seed-token=${SEED_TOKEN:}
seed-password=${SEED_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
wallet-url=${WALLET_URL:http://localhost:8084}
