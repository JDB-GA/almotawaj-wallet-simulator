services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: almotawaj
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  identity-service:
    build: ./services/identity-service
    container_name: identity-service
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/almotawaj
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WALLET_URL: http://wallet-service:8084
    depends_on:
      - kafka
    restart: unless-stopped

  wallet-service:
    build: ./services/wallet-service
    container_name: wallet-service
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/almotawaj
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      IDENTITY_URL: http://identity-service:8081
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped

  audit-service:
    build: ./services/audit-service
    container_name: audit-service
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/almotawaj
    depends_on:
      - kafka
      - postgres
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    env_file: .env
    environment:
      IDENTITY_URL: http://identity-service:8081
      WALLET_URL: http://wallet-service:8084
      AUDIT_URL: http://audit-service:8083
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - wallet-service
      - audit-service
    restart: unless-stopped

volumes:
  postgres-data: