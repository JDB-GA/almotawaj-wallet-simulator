spring.application.name=api-gateway
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${PORT:8000}
server.error.include-stacktrace=never

spring.cloud.gateway.server.webmvc.routes[0].id=wallet-admin-user-transactions
spring.cloud.gateway.server.webmvc.routes[0].uri=${WALLET_URL}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/admin/users/*/transactions
spring.cloud.gateway.server.webmvc.routes[0].order=0

spring.cloud.gateway.server.webmvc.routes[1].id=identity
spring.cloud.gateway.server.webmvc.routes[1].uri=${IDENTITY_URL}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/auth/**,/api/profile,/api/profile/**,/api/kyc/**,/api/admin/kyc/**,/api/admin/users,/api/admin/users/**,/api/admin/statistics/users,/api/seed,/api/admin/seed-data
spring.cloud.gateway.server.webmvc.routes[1].order=1

spring.cloud.gateway.server.webmvc.routes[2].id=wallet
spring.cloud.gateway.server.webmvc.routes[2].uri=${WALLET_URL}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/wallet/**,/api/checkout/**,/api/merchant/**,/api/gateway/**,/api/vouchers,/api/vouchers/**,/api/notifications/**,/api/admin/transactions/**,/api/admin/transactions,/api/admin/statistics/transactions,/api/admin/simulations/**,/api/seed/wallet,/api/admin/seed-data/wallet
spring.cloud.gateway.server.webmvc.routes[2].order=1

spring.cloud.gateway.server.webmvc.routes[3].id=audit
spring.cloud.gateway.server.webmvc.routes[3].uri=${AUDIT_URL}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/admin/audit-logs,/api/admin/audit-logs/**
spring.cloud.gateway.server.webmvc.routes[3].order=1

management.endpoints.web.exposure.include=health,gateway
