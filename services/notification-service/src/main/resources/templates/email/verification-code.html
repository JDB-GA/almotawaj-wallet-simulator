<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" th:dir="${direction}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{email.verification.subject}">Verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Tahoma,Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:480px;background-color:#ffffff;border-radius:12px;border:1px solid #e5e5e5;">
                <tr>
                    <td align="center" style="padding:32px 32px 8px;">
                        <img th:src="${logoUrl}" src="" width="80" height="80"
                             th:alt="#{email.app-name}" alt="Logo" style="display:block;border:0;">
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:8px 32px 0;color:#171717;font-size:22px;font-weight:bold;"
                        th:text="#{email.verification.heading}">Verify your email</td>
                </tr>
                <tr>
                    <td align="center" style="padding:12px 32px 0;color:#525252;font-size:15px;line-height:1.6;"
                        th:text="#{email.verification.intro}">Use this code to verify your email address:</td>
                </tr>
                <tr>
                    <td align="center" style="padding:24px 32px;">
                        <div dir="ltr" th:text="${code}"
                             style="display:inline-block;padding:16px 28px;background-color:#f5f5f5;border-radius:10px;color:#171717;font-family:'Courier New',monospace;font-size:34px;font-weight:bold;letter-spacing:10px;">
                            123456
                        </div>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:0 32px;color:#525252;font-size:14px;line-height:1.6;"
                        th:text="#{email.verification.expiry(${expiryMinutes})}">This code expires in 10 minutes.</td>
                </tr>
                <tr>
                    <td align="center" style="padding:16px 32px 32px;color:#a3a3a3;font-size:13px;line-height:1.6;"
                        th:text="#{email.verification.ignore}">If you did not request this code, you can ignore this email.</td>
                </tr>
            </table>
            <p style="margin:16px 0 0;color:#a3a3a3;font-size:12px;" th:text="#{email.app-name}">Almotawaj Digital Wallet</p>
        </td>
    </tr>
</table>
</body>
</html>
