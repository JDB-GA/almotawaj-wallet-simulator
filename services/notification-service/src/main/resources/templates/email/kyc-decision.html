<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Identity verification update</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Tahoma,Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:480px;background-color:#ffffff;border-radius:12px;border:1px solid #e5e5e5;">
                <tr>
                    <td align="center" style="padding:32px 32px 8px;">
                        <img th:src="${logoUrl}" src="" width="80" height="80" alt="Logo" style="display:block;border:0;">
                    </td>
                </tr>
                <tr th:each="section, state : ${sections}">
                    <td th:lang="${section.language()}" th:dir="${section.direction()}"
                        th:style="${state.last} ? 'padding:20px 32px 32px;' : 'padding:20px 32px;border-bottom:1px solid #e5e5e5;'">
                        <p style="margin:0;color:#171717;font-size:20px;font-weight:bold;" th:text="${section.heading()}">Heading</p>
                        <p style="margin:12px 0 0;color:#525252;font-size:15px;line-height:1.6;" th:text="${section.body()}">Body</p>
                        <p th:if="${reason}" style="margin:12px 0 0;color:#b91c1c;font-size:15px;line-height:1.6;">
                            <strong th:text="${section.reasonLabel()}">Reason:</strong>
                            <span dir="auto" th:text="${reason}">Reason text</span>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
