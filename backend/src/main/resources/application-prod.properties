server.port=${PORT:8080}
server.error.include-stacktrace=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt-secret=${JWT_SECRET}
jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}
auth-cookie-secure=true
cors-allowed-origins=${CORS_ALLOWED_ORIGINS}

resend-api-key=${RESEND_API_KEY}

spring.messages.fallback-to-system-locale=false
otp-secret=${OTP_SECRET}
mail-from=${MAIL_FROM}
mail-logo-url=${MAIL_LOGO_URL:https://almotawaj.com/logo/logo.png}

storage-root=${STORAGE_ROOT:/data/uploads}
app-url=${APP_URL:https://wallet.almotawaj.com}
seed-token=${SEED_TOKEN:}
seed-password=${SEED_PASSWORD:}
server.forward-headers-strategy=native
webhook-allow-private-hosts=${WEBHOOK_ALLOW_PRIVATE_HOSTS:false}
